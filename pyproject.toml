[project]
name = "cordis-python"
version = "0.8.0"
description = "A Python implementation of Cordis: spatiotemporal composability for dynamic systems"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["packaging>=24"]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
pydantic = ["pydantic>=2"]
watch = ["watchdog>=6"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "watchdog>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cordis_py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
