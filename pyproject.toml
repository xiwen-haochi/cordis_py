[project]
name = "cordis-python"
version = "0.9.1"
description = "A Python implementation of Cordis: spatiotemporal composability for dynamic systems"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["packaging>=24"]

[project.urls]
Homepage = "https://github.com/xiwen-haochi/cordis_py"
Repository = "https://github.com/xiwen-haochi/cordis_py"
Issues = "https://github.com/xiwen-haochi/cordis_py/issues"

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
pydantic = ["pydantic>=2"]
watch = ["watchdog>=6"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "watchdog>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cordis_py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
# AI 文档仅本地保留：不进入源码发布物
exclude = ["docs/", "DEVELOPMENT.md"]
